name: masterly-deploy

services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-masterly}
      POSTGRES_USER: ${DB_USER:-masterly}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.deploy}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-masterly}
      DB_USER: ${DB_USER:-masterly}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.deploy}
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env.deploy}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in .env.deploy}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      STORAGE_BACKEND: local
      STORAGE_LOCAL_DIR: /app/data/files
    volumes:
      - app-data:/app/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health/ready', timeout=2).close()"]
      interval: 5s
      timeout: 3s
      retries: 12

  web:
    build:
      context: ./web
    restart: unless-stopped
    environment:
      MASTERLY_API_BASE_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy

  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    environment:
      MASTERLY_HTTPS_DOMAIN: ${MASTERLY_HTTPS_DOMAIN:-}
      NGINX_ENVSUBST_FILTER: '^MASTERLY_HTTPS_DOMAIN'
    ports:
      - "${HTTP_BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-80}:80"
      - "${HTTP_BIND_ADDRESS:-0.0.0.0}:${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/nginx${MASTERLY_HTTPS_DOMAIN:+-https}.conf:/etc/nginx/templates/default.conf.template:ro
      - ./deploy/nginx-proxy.conf:/etc/nginx/masterly-proxy.conf:ro
      - /var/www/certbot:/var/www/certbot:ro
      - /etc/letsencrypt/live:/etc/letsencrypt/live:ro
      - /etc/letsencrypt/archive:/etc/letsencrypt/archive:ro
    depends_on:
      - web

volumes:
  db-data:
  app-data:
