map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name ${MASTERLY_HTTPS_DOMAIN};

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://${MASTERLY_HTTPS_DOMAIN}$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name ${MASTERLY_HTTPS_DOMAIN};

    ssl_certificate /etc/letsencrypt/live/${MASTERLY_HTTPS_DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${MASTERLY_HTTPS_DOMAIN}/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    include /etc/nginx/masterly-proxy.conf;
}
