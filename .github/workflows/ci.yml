name: CI

on:
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests and migrations
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: masterly_ci
          POSTGRES_USER: masterly_ci
          POSTGRES_PASSWORD: masterly_ci
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U masterly_ci -d masterly_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DB_HOST: 127.0.0.1
      DB_NAME: masterly_ci
      DB_USER: masterly_ci
      DB_PASSWORD: masterly_ci
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: python -m pip install '.[dev]'
      - name: Apply migrations to a fresh database
        env:
          DB_PORT: ${{ job.services.postgres.ports[5432] }}
        run: python -m alembic upgrade head
      - name: Run backend tests
        env:
          DB_PORT: ${{ job.services.postgres.ports[5432] }}
        run: python -m pytest

  frontend:
    name: Next.js build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build Next.js
        run: npm run build
