name: Publish Docker images

on:
  push:
    branches: [main]

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build backend and web images
        run: |
          image_prefix="ghcr.io/${GITHUB_REPOSITORY,,}"
          source_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"

          docker build --platform linux/amd64 --file Dockerfile \
            --label "org.opencontainers.image.source=${source_url}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "${image_prefix}-backend:${GITHUB_SHA}" .

          docker build --platform linux/amd64 --file web/Dockerfile \
            --label "org.opencontainers.image.source=${source_url}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "${image_prefix}-web:${GITHUB_SHA}" web

      - name: Publish images to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image_prefix="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "${image_prefix}-backend:${GITHUB_SHA}"
          docker push "${image_prefix}-web:${GITHUB_SHA}"

  deploy:
    name: Deploy to EC2
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    concurrency:
      group: masterly-production-deploy
      queue: max
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out release code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Assume AWS deploy role
        uses: aws-actions/configure-aws-credentials@45666896f5d8e0f10ae255413f3a4cdd03bdc8f5 # v6.3.1
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy and wait for Run Command
        env:
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          : "${EC2_INSTANCE_ID:?Set EC2_INSTANCE_ID in repository variables}"
          image_prefix="ghcr.io/${GITHUB_REPOSITORY,,}"
          remote_command=$(cat <<EOF
          sudo -n -H -u ubuntu bash -s -- '$GITHUB_SHA' '$image_prefix' <<'MASTERLY_DEPLOY_SCRIPT'
          $(cat deploy/deploy.sh)
          MASTERLY_DEPLOY_SCRIPT
          EOF
          )
          parameters=$(jq -cn --arg command "$remote_command" \
            '{commands: [$command], executionTimeout: ["900"]}')
          command_id=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --timeout-seconds 120 \
            --parameters "$parameters" \
            --query 'Command.CommandId' --output text)
          echo "SSM command: $command_id"

          for ((attempt = 0; attempt < 210; attempt++)); do
            if invocation=$(aws ssm get-command-invocation \
              --command-id "$command_id" --instance-id "$EC2_INSTANCE_ID" --output json 2>&1); then
              status=$(jq -er '.Status' <<< "$invocation")
              case "$status" in
                Pending|InProgress|Delayed|Cancelling) ;;
                *)
                  jq -r '.StandardOutputContent, .StandardErrorContent' <<< "$invocation"
                  echo "SSM status: $status"
                  [[ "$status" == Success ]]
                  exit
                  ;;
              esac
            elif [[ "$invocation" != *InvocationDoesNotExist* ]]; then
              printf '%s\n' "$invocation" >&2
              exit 1
            fi
            sleep 5
          done
          echo "Timed out waiting for SSM command $command_id" >&2
          exit 1
